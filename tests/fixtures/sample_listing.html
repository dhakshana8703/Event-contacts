<!DOCTYPE html>
<html>
<head><title>Dubai Business Events Calendar</title></head>
<body>
<div class="row">
  <!-- Card 1: AccessAbilities Expo with zero-width space -->
  <div class="events__item">
    <div class="events__image-wrap">
      <div class="events__text-info events__text-info--category">Exhibition</div>
      <div class="events__date-item">19 Oct / 21 Oct</div>
    </div>
    <div class="events__info">
      <a class="events__item-title" href="https://www.investindubai.gov.ae/en/events-calendar/accessabilities-expo">
        AccessAbilities Expo &#x200b;
      </a>
    </div>
  </div>

  <!-- Card 2: WETEX with relative URL -->
  <div class="events__item">
    <div class="events__image-wrap">
      <div class="events__text-info events__text-info--category">Exhibitions</div>
      <div class="events__date-item">20 Oct / 22 Oct</div>
    </div>
    <div class="events__info">
      <a class="events__item-title" href="/en/events-calendar/wetex">
        WETEX &amp; Dubai Solar Show
      </a>
    </div>
  </div>

  <!-- Card 3: Incomplete card missing title link -->
  <div class="events__item">
    <div class="events__image-wrap">
      <div class="events__text-info events__text-info--category">Conference</div>
    </div>
    <div class="events__info">
      <span class="unlinked-title">Unlinked Workshop</span>
    </div>
  </div>
</div>
</body>
</html>
